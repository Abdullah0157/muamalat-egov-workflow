# Muamalat web tier: serves the Angular bundle and reverse-proxies the API.
#
# THIS FILE IS A TEMPLATE. infra/web-entrypoint.sh runs envsubst over it at container
# start and substitutes exactly two placeholders:
#
#   ${WEB_API_UPSTREAM}     scheme://host:port of the API      (default http://api:8080)
#   ${WEB_KEYCLOAK_ORIGIN}  browser-facing Keycloak origin      (default http://localhost:8081)
#
# Every other $name in this file is an nginx runtime variable and is left alone.
#
# The process runs as uid 101 (nginx), so there is no `user` directive, the listen port is
# unprivileged, and the pid file lives in /tmp.

worker_processes  auto;
pid               /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log  /dev/stdout main;
    error_log   /dev/stderr warn;

    # Docker's embedded DNS server. Required because proxy_pass below uses a variable,
    # which defers name resolution from config-load time to request time. Without it,
    # nginx would resolve `api` exactly once at startup and keep sending traffic to a dead
    # IP after the API container is recreated. It also means nginx starts fine when the
    # API is not up yet instead of refusing to load its config.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain
                      text/css
                      text/xml
                      application/javascript
                      application/json
                      application/manifest+json
                      application/xml
                      image/svg+xml
                      font/ttf
                      font/woff
                      font/woff2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Citizens attach supporting documents (trade licences, site plans, ID scans).
        client_max_body_size 20m;
        client_body_buffer_size 128k;

        # --- Security headers -------------------------------------------------------
        #
        # Declared once at server level. No `location` below uses add_header, because
        # add_header in a nested block REPLACES the inherited set rather than adding to
        # it, which is the single most common way these headers silently disappear.
        # Cache policy is therefore expressed with `expires`, which does not reset them.
        add_header X-Content-Type-Options    "nosniff"                      always;
        add_header X-Frame-Options           "DENY"                         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin"                 always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

        # style-src allows 'unsafe-inline' because the Angular compiler emits component
        # styles as inline <style> elements. Removing it requires switching Angular to
        # nonce-based CSP (ngCspNonce) and threading a per-request nonce through nginx;
        # that is a real improvement and is listed as a known limitation, not pretended away.
        #
        # connect-src and frame-src include the Keycloak origin: the browser talks to
        # Keycloak directly for the token exchange and the check-session iframe.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' ${WEB_KEYCLOAK_ORIGIN}; frame-src 'self' ${WEB_KEYCLOAK_ORIGIN}" always;

        # --- Container liveness -----------------------------------------------------
        # Answered by nginx itself, so it reports on the web tier only and does not turn
        # an API outage into a web-container restart loop.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Runtime SPA configuration, written by the entrypoint. Never cached, otherwise a
        # browser would keep pointing at a previous environment's identity provider.
        location = /config.json {
            expires -1;
        }

        # --- API reverse proxy ------------------------------------------------------
        #
        # Declared BEFORE the static-asset regex on purpose: nginx takes the first
        # matching regex location, and an API path such as /api/attachments/plan.png must
        # not be captured by the asset rule and served as a 404 from disk.
        #
        # The /api prefix is PRESERVED end to end. The ASP.NET Core app must map its
        # endpoints under /api (for example /api/v1/requests); nothing is rewritten here,
        # which keeps the URL a client sees identical to the URL the API logs.
        location ~ ^/(api|health|openapi|scalar|swagger)(/|$) {
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Streaming responses (server-sent request-status updates) must not sit in an
            # nginx buffer waiting to fill.
            proxy_buffering off;
            proxy_request_buffering off;

            # Variable form so the hostname is resolved per request via the resolver above.
            # $request_uri already carries the query string, so no ?$args suffix.
            set $api_upstream "${WEB_API_UPSTREAM}";
            proxy_pass $api_upstream$request_uri;
        }

        # --- Static assets ----------------------------------------------------------
        # The Angular production build hashes these filenames, so the content at a given
        # URL never changes and a one-year immutable cache is safe.
        location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
            expires 1y;
            access_log off;
            try_files $uri =404;
        }

        # --- SPA fallback -----------------------------------------------------------
        # Deep links such as /requests/8f2c/timeline are routed by Angular, not by nginx,
        # so anything that is not a real file returns index.html and the router takes over.
        # index.html itself is revalidated on every load, otherwise a cached shell would
        # keep referencing the previous deploy's hashed bundles.
        #
        # Note there is deliberately no server-level `error_page 404 /index.html`. That is
        # a popular SPA snippet and it is wrong here: it would also swallow genuine 404s
        # from the proxied API and hand the caller an HTML page with a 200 status.
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
